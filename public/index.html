<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClaudeDash</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080b0f;
    --surface:   #0e1318;
    --border:    #1c2530;
    --text:      #c9d4e0;
    --muted:     #4a5a6b;
    --accent:    #e8a838;
    --green:     #3ecf6a;
    --yellow:    #e8c438;
    --red:       #e85438;
    --blue:      #38a8e8;
    --glow-g:    rgba(62,207,106,.18);
    --glow-y:    rgba(232,196,56,.18);
    --glow-r:    rgba(232,84,56,.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 2rem;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,168,56,.07), transparent),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,.015) 40px);
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 800;
    font-size: 1.8rem;
    letter-spacing: -.02em;
    color: #fff;
  }

  header h1 span { color: var(--accent); }

  .live-badge {
    font-size: .65rem;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--green);
    border: 1px solid rgba(62,207,106,.3);
    padding: 2px 8px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .live-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .4; transform: scale(.7); }
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
    margin-bottom: 1.2rem;
  }

  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.6rem;
    position: relative;
    overflow: hidden;
    transition: border-color .3s;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }

  .card.green::before { background: radial-gradient(ellipse at top, var(--glow-g), transparent 70%); opacity: 1; }
  .card.yellow::before { background: radial-gradient(ellipse at top, var(--glow-y), transparent 70%); opacity: 1; }
  .card.red::before { background: radial-gradient(ellipse at top, var(--glow-r), transparent 70%); opacity: 1; }
  .card.green { border-color: rgba(62,207,106,.25); }
  .card.yellow { border-color: rgba(232,196,56,.25); }
  .card.red { border-color: rgba(232,84,56,.35); }

  .card-label {
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .8rem;
  }

  .pct-row {
    display: flex;
    align-items: flex-end;
    gap: .5rem;
    margin-bottom: 1rem;
  }

  .pct-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.8rem;
    font-weight: 400;
    line-height: 1;
    transition: color .4s;
  }

  .pct-sym {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--muted);
    padding-bottom: .3rem;
  }

  .bar-track {
    background: rgba(255,255,255,.05);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    margin-bottom: .8rem;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1s cubic-bezier(.4,0,.2,1), background .4s;
    position: relative;
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 20px; height: 100%;
    background: rgba(255,255,255,.35);
    filter: blur(4px);
  }

  .bar-green  { background: linear-gradient(90deg, #2a9e4f, var(--green)); }
  .bar-yellow { background: linear-gradient(90deg, #b89a20, var(--yellow)); }
  .bar-red    { background: linear-gradient(90deg, #b03020, var(--red)); animation: flicker .8s ease-in-out infinite alternate; }

  @keyframes flicker { from { opacity: .85; } to { opacity: 1; } }

  .reset-info {
    font-size: .72rem;
    color: var(--muted);
  }

  .reset-info strong { color: var(--text); }

  /* history card */
  .card-wide {
    grid-column: 1 / -1;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }

  .time-tabs {
    display: flex;
    gap: .4rem;
  }

  .tab {
    font-family: 'DM Mono', monospace;
    font-size: .65rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }

  .tab.active, .tab:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  canvas { max-height: 200px; }

  /* status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.2rem;
    font-size: .68rem;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .statusbar .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--green);
  }

  .statusbar .dot.error { background: var(--red); }

  /* extra usage pill */
  .extra-pill {
    display: inline-block;
    font-size: .62rem;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    margin-top: .5rem;
  }
</style>
</head>
<body>

<header>
  <h1>Claude<span>Dash</span></h1>
  <span class="live-badge" id="live-badge">live</span>
</header>

<div class="grid">
  <!-- 5-hour card -->
  <div class="card" id="card-5h">
    <div class="card-label">5-Hour Session</div>
    <div class="pct-row">
      <span class="pct-num" id="pct-5h">—</span>
      <span class="pct-sym">%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-5h" style="width:0%"></div></div>
    <div class="reset-info" id="reset-5h">loading…</div>
  </div>

  <!-- 7-day card -->
  <div class="card" id="card-7d">
    <div class="card-label">7-Day Rolling</div>
    <div class="pct-row">
      <span class="pct-num" id="pct-7d">—</span>
      <span class="pct-sym">%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-7d" style="width:0%"></div></div>
    <div class="reset-info" id="reset-7d">loading…</div>
  </div>

  <!-- history chart -->
  <div class="card card-wide">
    <div class="chart-header">
      <div class="card-label" style="margin:0">Usage History</div>
      <div class="time-tabs">
        <button class="tab active" onclick="loadHistory(3,this)">3h</button>
        <button class="tab" onclick="loadHistory(6,this)">6h</button>
        <button class="tab" onclick="loadHistory(24,this)">24h</button>
        <button class="tab" onclick="loadHistory(168,this)">7d</button>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="statusbar">
  <span><span class="dot" id="status-dot"></span><span id="status-text">connecting</span></span>
  <span id="last-updated"></span>
</div>

<script>
// ── Chart setup ──────────────────────────────────────────────────────────────
const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      {
        label: '5-Hour %',
        data: [],
        borderColor: '#e8a838',
        backgroundColor: 'rgba(232,168,56,.08)',
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 5,
        fill: true,
        tension: .35,
      },
      {
        label: '7-Day %',
        data: [],
        borderColor: '#3ecf6a',
        backgroundColor: 'rgba(62,207,106,.06)',
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 5,
        fill: true,
        tension: .35,
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: {
        labels: {
          color: '#4a5a6b',
          font: { family: 'DM Mono', size: 11 },
          boxWidth: 12,
        }
      },
      tooltip: {
        backgroundColor: '#0e1318',
        borderColor: '#1c2530',
        borderWidth: 1,
        titleColor: '#c9d4e0',
        bodyColor: '#4a5a6b',
        titleFont: { family: 'DM Mono' },
        bodyFont: { family: 'DM Mono' },
        callbacks: {
          label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
        }
      }
    },
    scales: {
      x: {
        ticks: { color: '#2e3d4d', font: { family: 'DM Mono', size: 10 }, maxTicksLimit: 8 },
        grid: { color: 'rgba(255,255,255,.04)' },
      },
      y: {
        min: 0, max: 100,
        ticks: { color: '#2e3d4d', font: { family: 'DM Mono', size: 10 }, callback: v => v + '%' },
        grid: { color: 'rgba(255,255,255,.04)' },
      }
    }
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function colorClass(pct) {
  if (pct == null) return 'green';
  if (pct >= 90) return 'red';
  if (pct >= 70) return 'yellow';
  return 'green';
}

function barClass(pct) {
  if (pct == null) return 'bar-green';
  if (pct >= 90) return 'bar-red';
  if (pct >= 70) return 'bar-yellow';
  return 'bar-green';
}

function formatCountdown(isoStr) {
  if (!isoStr) return '';
  const diff = new Date(isoStr) - Date.now();
  if (diff <= 0) return 'resetting soon';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function formatTime(isoStr) {
  return new Date(isoStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Update cards ──────────────────────────────────────────────────────────────
function updateCard(cardId, pctElId, barElId, resetElId, pct, resetsAt) {
  const card  = document.getElementById(cardId);
  const pctEl = document.getElementById(pctElId);
  const barEl = document.getElementById(barElId);
  const rstEl = document.getElementById(resetElId);

  const cls = colorClass(pct);
  card.className = `card ${cls}`;
  pctEl.textContent = pct != null ? pct.toFixed(1) : '—';
  pctEl.style.color = cls === 'red' ? 'var(--red)' : cls === 'yellow' ? 'var(--yellow)' : 'var(--green)';
  barEl.style.width = `${Math.min(pct ?? 0, 100)}%`;
  barEl.className = `bar-fill ${barClass(pct)}`;

  if (resetsAt) {
    const countdown = formatCountdown(resetsAt);
    rstEl.innerHTML = `Resets in <strong>${countdown}</strong> &nbsp;·&nbsp; ${new Date(resetsAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  }
}

// ── Poll current usage ────────────────────────────────────────────────────────
async function fetchUsage() {
  try {
    const data = await fetch('/api/usage').then(r => r.json());
    const dot  = document.getElementById('status-dot');
    const txt  = document.getElementById('status-text');
    const upd  = document.getElementById('last-updated');

    if (!data.ok) {
      dot.className = 'dot error';
      txt.textContent = `error: ${data.status}`;
      return;
    }

    dot.className = 'dot';
    txt.textContent = 'connected · polling every 60s';
    upd.textContent = `updated ${formatTime(data.last_updated)}`;

    updateCard('card-5h', 'pct-5h', 'bar-5h', 'reset-5h', data.five_hour, data.fh_resets);
    updateCard('card-7d', 'pct-7d', 'bar-7d', 'reset-7d', data.seven_day, data.sd_resets);

  } catch(e) {
    document.getElementById('status-dot').className = 'dot error';
    document.getElementById('status-text').textContent = 'fetch error';
  }
}

// ── Load history chart ────────────────────────────────────────────────────────
let currentHours = 3;

async function loadHistory(hours, btn) {
  currentHours = hours;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');

  try {
    const rows = await fetch(`/api/history?hours=${hours}`).then(r => r.json());

    chart.data.labels = rows.map(r => formatTime(r.ts));
    chart.data.datasets[0].data = rows.map(r => r.five_hour);
    chart.data.datasets[1].data = rows.map(r => r.seven_day);
    chart.update('none');
  } catch(e) {
    console.error('History fetch failed', e);
  }
}

// ── Countdown ticker (updates every second without API calls) ─────────────────
function tickCountdowns() {
  // re-read current reset times from DOM would be complex; just re-fetch
  // actual reset times are stored in latest_data on server
}

// ── Init ──────────────────────────────────────────────────────────────────────
fetchUsage();
loadHistory(3);

setInterval(fetchUsage,   10_000);   // refresh display every 10s
setInterval(() => loadHistory(currentHours), 60_000); // reload chart every 60s
</script>
</body>
</html>
